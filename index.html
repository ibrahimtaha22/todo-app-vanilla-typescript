<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <!-- Assumes Tailwind is wired up via your Vite build (postcss/tailwind.config.js) -->
    <link rel="stylesheet" href="./src/style.css" />
    <!-- Google Fonts: Josefin Sans is the typeface used in the official Frontend Mentor design -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="font-['Josefin_Sans'] bg-[#fafafa] dark:bg-[#171823] transition-colors duration-300 min-h-screen"
  >
    <!-- ============================================= -->
    <!-- HERO / HEADER BACKGROUND                       -->
    <!-- ============================================= -->
    <div
      class="relative bg-cover bg-center bg-no-repeat bg-[url('./assets/bg-mobile-light.jpg')] dark:bg-[url('./assets/bg-mobile-dark.jpg')] sm:bg-[url('./assets/bg-desktop-light.jpg')] sm:dark:bg-[url('./assets/bg-desktop-dark.jpg')] h-50 sm:h-75 w-full"
    >
      <div
        class="max-w-135 mx-auto px-6 sm:px-0 pt-8 sm:pt-12 flex items-center justify-between"
      >
        <!-- Logo -->
        <h1
          class="text-white text-[28px] sm:text-[32px] font-bold tracking-[0.3em] sm:tracking-[0.4em]"
        >
          TODO
        </h1>

        <!-- Theme Toggle -->
        <button
          id="theme-toggle"
          aria-label="Toggle theme"
          class="w-6 h-6 sm:w-7 sm:h-7 cursor-pointer"
        >
          <!-- Sun icon: shown in dark mode (click to switch to light) -->
          <svg
            id="icon-sun"
            class="hidden dark:block w-full h-full"
            viewBox="0 0 26 26"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M13 0v2.5M13 23.5V26M26 13h-2.5M2.5 13H0M22.132 3.868l-1.768 1.768M5.636 20.364l-1.768 1.768M22.132 22.132l-1.768-1.768M5.636 5.636L3.868 3.868M19 13a6 6 0 11-12 0 6 6 0 0112 0z"
              stroke="#FFFFFF"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
          <!-- Moon icon: shown in light mode (click to switch to dark) -->
          <svg
            id="icon-moon"
            class="block dark:hidden w-full h-full"
            viewBox="0 0 26 26"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M13 0a13 13 0 000 26c4.4 0 8.2-2.4 10.2-6-1.2.5-2.6.8-4 .8-6 0-10.8-4.8-10.8-10.8 0-3.2 1.4-6.1 3.6-8-.9-.7-2-1-3-1z"
              fill="#FFFFFF"
            />
          </svg>
        </button>
      </div>

      <!-- ============================================= -->
      <!-- INPUT FIELD (overlapping hero background)      -->
      <!-- ============================================= -->
      <div
        class="max-w-[540px] mx-auto px-6 sm:px-0 absolute left-0 right-0 top-[100px] sm:top-[140px]"
      >
        <form
          id="todo-form"
          class="flex items-center gap-4 bg-white dark:bg-[#25273d] rounded-lg shadow-[0_35px_50px_-15px_rgba(0,0,0,0.5)] px-5 py-4 sm:px-6 sm:py-5"
        >
          <!-- Empty circle (decorative, matches checkbox style but non-interactive) -->
          <span
            class="w-6 h-6 sm:w-7 sm:h-7 rounded-full border border-[#e3e4f1] dark:border-[#393a4b] shrink-0"
          ></span>
          <input
            id="todo-input"
            type="text"
            placeholder="Create a new todo..."
            class="w-full bg-transparent outline-none border-none text-[13px] sm:text-lg text-[#494c6b] dark:text-[#c8cbe7] placeholder-[#9495a5] dark:placeholder-[#767992]"
          />
        </form>
      </div>
    </div>

    <!-- ============================================= -->
    <!-- MAIN CONTENT                                   -->
    <!-- ============================================= -->
    <main
      class="max-w-[540px] mx-auto px-6 sm:px-0 -mt-[28px] sm:-mt-[80px] pb-10 relative z-10"
    >
      <!-- Todo List Card -->
      <div
        class="bg-white dark:bg-[#25273d] rounded-lg shadow-[0_35px_50px_-15px_rgba(0,0,0,0.3)] overflow-hidden"
      >
        <ul
          id="todo-list"
          class="divide-y divide-[#e3e4f1] dark:divide-[#393a4b]"
        ></ul>

        <!-- ========================================= -->
        <!-- BOTTOM STATUS BAR                          -->
        <!-- ========================================= -->
        <div
          class="flex items-center justify-between px-5 py-4 sm:px-6 sm:py-4 text-[12px] sm:text-sm text-[#9495a5] dark:text-[#5b5e7e]"
        >
          <span id="items-left">0 items left</span>

          <!-- Filters: hidden on mobile, shown inline on desktop -->
          <div
            id="filters-desktop"
            class="hidden sm:flex items-center gap-5 font-bold"
          >
            <button
              type="button"
              data-filter="all"
              class="filter-btn text-[#3a7bfd] hover:text-[#494c6b] dark:hover:text-[#e3e4f1] transition-colors"
            >
              All
            </button>
            <button
              type="button"
              data-filter="active"
              class="filter-btn hover:text-[#494c6b] dark:hover:text-[#e3e4f1] transition-colors"
            >
              Active
            </button>
            <button
              type="button"
              data-filter="completed"
              class="filter-btn hover:text-[#494c6b] dark:hover:text-[#e3e4f1] transition-colors"
            >
              Completed
            </button>
          </div>

          <button
            id="clear-completed"
            type="button"
            class="hover:text-[#494c6b] dark:hover:text-[#e3e4f1] transition-colors"
          >
            Clear Completed
          </button>
        </div>
      </div>

      <!-- ========================================= -->
      <!-- FILTERS — MOBILE ONLY (separate block)      -->
      <!-- ========================================= -->
      <div
        id="filters-mobile"
        class="flex sm:hidden items-center justify-center gap-5 mt-4 py-4 bg-white dark:bg-[#25273d] rounded-lg shadow-[0_35px_50px_-15px_rgba(0,0,0,0.3)] text-sm font-bold text-[#9495a5] dark:text-[#5b5e7e]"
      >
        <button
          type="button"
          data-filter="all"
          class="filter-btn text-[#3a7bfd]"
        >
          All
        </button>
        <button
          type="button"
          data-filter="active"
          class="filter-btn disabled:cursor-not-allowed"
        >
          Active
        </button>
        <button type="button" data-filter="completed" class="filter-btn">
          Completed
        </button>
      </div>

      <!-- Footer hint -->
      <p
        class="text-center text-[13px] sm:text-sm text-[#9495a5] dark:text-[#5b5e7e] mt-8"
      >
        Drag and drop to reorder list
      </p>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
